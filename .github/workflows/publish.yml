# 发布到 npm —— 走 Trusted Publishing（OIDC），不保存任何长期令牌。
#
# 前置条件（一次性，在 npmjs.com 上配）：
#   包 Settings → Trusted Publishing → GitHub Actions
#     Organization or user : ymh0000123
#     Repository           : dsh-theme-endfield
#     Workflow filename    : publish.yml   ← 只写文件名，不带路径
#     Environment name     : 留空
#   字段区分大小写，每个包只能配一个 trusted publisher。
#
# 于是这里不需要 NPM_TOKEN / secrets.NPM_TOKEN，凭据由 id-token 现换现用，
# 公开仓库的公开包会自动带上 provenance（来源可追溯）。

name: Publish

on:
  # 只有打 tag 才发布；push main 不发，避免每次合并都动 npm。
  push:
    tags: ['v*']
  workflow_dispatch:

# 顶层收紧到只读，发布所需的 id-token 权限只给 publish job。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布到 npm
    # Trusted Publishing 只认 GitHub 托管 runner，不能是自建机器。
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release 需要写权限
      id-token: write # OIDC 换取 npm 凭据，缺这行必然 403
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 取全历史，便于核对 tag 与提交

      # Node 22 自带的 npm 是 10.x，低于 OIDC 所需的 11.5.1；这里用 24 并再抬一次。
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 确保 npm CLI 支持 Trusted Publishing
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version) / node $(node --version)"

      # 版本纪律门禁：v1.2.1 那次 tag 与包内 version 就不一致，现有 CI 没挡住。
      # 门禁不设 tag 条件：workflow_dispatch 从分支上触发时同样要被拦下，否则
      # 手动发布可以绕过 tag/version 一致性，发出一个没有 tag、没有 Release 的
      # 版本——恰恰是这个门禁要防的事故。从分支 dispatch 想重发？选中对应的
      # tag 作为 ref 再跑。
      - name: 校验发布来源是 v* tag 且与 package.json 版本一致
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "::error title=非 tag 发布::只有 v* tag 才允许发布；workflow_dispatch 请选中对应 tag 作为 ref 运行"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error file=package.json,line=2,title=版本号不一致::tag v$tag 与 package.json 的 $ver 不一致"
            exit 1
          fi

      # 测试清单里大量用例要开 headless 浏览器。ci.yml 里这套前置条件必须一起搬过来，
      # 否则它们整批报 "no Chrome/Edge found (set CHROME_PATH)" —— 第一次 tag 发布
      # 就是这样被挡下的，看着像测试坏了，其实是环境没铺。
      - name: 定位 Chrome
        run: |
          p="$(command -v google-chrome || command -v google-chrome-stable \
            || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$p" ]; then
            echo "::error title=环境缺失::runner 上找不到 Chrome/Chromium，浏览器测试无法运行"
            exit 1
          fi
          echo "CHROME_PATH=$p" >> "$GITHUB_ENV"
          echo "使用 $p"
          "$p" --version

      # 这些测试用 `'file:///' + 绝对路径` 拼 URL，该拼法只在 Windows 上天然正确。
      # 先探一次，万一失效就给出明确诊断，而不是让一批测试一起神秘失败。
      - name: headless Chrome 冒烟检查
        run: |
          tmp="$(mktemp -d)"
          printf '<!doctype html><title>SMOKE-OK</title>' > "$tmp/probe.html"
          url="file:///$tmp/probe.html"
          dom="$("$CHROME_PATH" --headless=new --disable-gpu --no-sandbox \
            --user-data-dir="$(mktemp -d)" --dump-dom "$url" 2>/dev/null || true)"
          case "$dom" in
            *SMOKE-OK*) echo "ok    headless Chrome 可通过 'file:///'+绝对路径 加载页面" ;;
            *) echo "::error title=file URL 拼法在 Linux 上失效::headless Chrome 打不开 $url"; exit 1 ;;
          esac

      # 复用仓库已有的清单解析脚本，与 ci.yml 跑同一套，发布前先挡红。
      - name: 跑测试套件
        run: node .github/scripts/run-tests.js test:ci

      - name: 发布到 npm
        run: npm publish --access public

      # GitHub 侧的发布，和 npm 同一个 tag。放在 npm 之后：npm 没发成功就
      # 不该留下一个声称「已发布」的 Release。
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "dsh-theme-endfield $GITHUB_REF_NAME" --generate-notes
